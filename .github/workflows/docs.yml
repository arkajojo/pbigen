name: Docs

# Build the MkDocs site and publish it to GitHub Pages (gh-pages branch) on every push to main.
# One-time: repo Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
